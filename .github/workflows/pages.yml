name: Deploy Harbor website

on:
  push:
    branches: [harbor]
    paths:
      - "site/**"
      - "docs/branding/harbor-app-icon.png"
      - "docs/screenshots/harbor-personal-samsung-api36.png"
      - "docs/screenshots/harbor-work-samsung-api36.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/assets
          cp site/index.html _site/index.html
          cp site/styles.css _site/styles.css
          cp site/script.js _site/script.js
          cp docs/branding/harbor-app-icon.png _site/assets/harbor-app-icon.png
          cp docs/screenshots/harbor-personal-samsung-api36.png _site/assets/harbor-personal-samsung-api36.png
          cp docs/screenshots/harbor-work-samsung-api36.png _site/assets/harbor-work-samsung-api36.png
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
