name: Android

on:
  push:
    branches: [harbor]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Release build
        run: ./gradlew --no-daemon assembleRelease
      - name: Generate release SBOM
        run: ./gradlew --no-daemon generateSbom
      - name: Verify prohibited permissions are absent
        run: scripts/verify-manifest.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harbor-unsigned-release
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            build/reports/sbom/cyclonedx-release.json

  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify deterministic unsigned release build
        run: sh scripts/verify-deterministic-build.sh
