name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Release build
        run: ./gradlew --no-daemon assembleRelease
      - name: Generate release SBOM
        run: ./gradlew --no-daemon generateSbom
      - name: Verify prohibited permissions are absent
        run: scripts/verify-manifest.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-unsigned-release
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            build/reports/sbom/cyclonedx-release.json

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: scripts/verify-reproducible.sh
