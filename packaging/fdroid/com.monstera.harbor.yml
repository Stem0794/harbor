AutoName: Harbor
Summary: Local work-profile isolation and app management
Description: |-
  Harbor creates a standard Android work profile and manages applications
  locally. Optional Advanced tools integrate with a separately installed
  Shizuku service. The core app does not require Shizuku or network access.
MaintainerNotes: |-
  The core work-profile controller does not depend on Shizuku. The optional
  Shizuku integration is disabled unless the user enables Advanced tools and
  grants access to a separately installed Shizuku service. Harbor does not
  bundle, download, or start that service.

