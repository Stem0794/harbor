<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#10181b"/>
      <stop offset="1" stop-color="#edf1ef"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#075a63"/>
      <stop offset="1" stop-color="#06383e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 700 34px system-ui, sans-serif; fill: #0b3035; }
      .subtitle { font: 400 18px system-ui, sans-serif; fill: #63777a; }
      .h1 { font: 700 28px system-ui, sans-serif; fill: #f5fbfb; }
      .h2 { font: 650 20px system-ui, sans-serif; fill: #f4f8f8; }
      .body { font: 400 15px system-ui, sans-serif; fill: #b7c6c7; }
      .small { font: 400 13px system-ui, sans-serif; fill: #91a3a5; }
      .accent { fill: #2fd4d0; }
      .pill { font: 600 12px system-ui, sans-serif; fill: #8cece8; }
      .danger { fill: #ff6268; }
      .divider { stroke: #2b393d; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" class="title">Harbor — Privacy Dashboard</text>
  <text x="600" y="83" text-anchor="middle" class="subtitle">Direction 2 · status-first, trustworthy, privacy-focused</text>

  <g transform="translate(115,120)" filter="url(#shadow)">
    <rect width="420" height="590" rx="48" fill="#070e11" stroke="#38464a" stroke-width="4"/>
    <rect x="16" y="18" width="388" height="554" rx="34" fill="#091519"/>
    <text x="42" y="58" class="h2">Harbor</text>
    <rect x="342" y="34" width="36" height="36" rx="12" fill="#0b393f"/>
    <path d="M360 42 l10 5 v9 c0 8-5 13-10 16-5-3-10-8-10-16v-9z" fill="none" stroke="#2fd4d0" stroke-width="2"/>

    <rect x="36" y="92" width="348" height="260" rx="26" fill="url(#hero)"/>
    <circle cx="62" cy="122" r="14" fill="#2fd4d0"/>
    <path d="M56 122 l4 4 8-9" fill="none" stroke="#083237" stroke-width="3" stroke-linecap="round"/>
    <text x="58" y="172" class="h1">Work space</text>
    <text x="58" y="207" class="h1">is ready</text>
    <text x="58" y="239" class="body">Your work apps and data stay</text>
    <text x="58" y="260" class="body">separate from your personal apps.</text>
    <rect x="58" y="282" width="304" height="50" rx="18" fill="#2fd4d0"/>
    <text x="210" y="314" text-anchor="middle" style="font:650 16px system-ui,sans-serif; fill:#052b30">Open Work</text>

    <rect x="36" y="370" width="348" height="154" rx="22" fill="#111f23" stroke="#26363a"/>
    <text x="58" y="400" class="h2">Privacy by default</text>
    <circle cx="64" cy="430" r="6" class="accent"/><text x="80" y="435" class="body">No network permission</text>
    <text x="80" y="454" class="small">Harbor itself cannot access the internet.</text>
    <circle cx="64" cy="478" r="6" class="accent"/><text x="80" y="483" class="body">No analytics</text>
    <circle cx="250" cy="478" r="6" class="accent"/><text x="266" y="483" class="body">Local only</text>

    <rect x="36" y="538" width="164" height="46" rx="16" fill="#11262a"/>
    <text x="118" y="566" text-anchor="middle" class="body">Send files</text>
    <rect x="220" y="538" width="164" height="46" rx="16" fill="#11262a"/>
    <text x="302" y="566" text-anchor="middle" class="body">Settings</text>
  </g>

  <g transform="translate(665,120)" filter="url(#shadow)">
    <rect width="420" height="590" rx="48" fill="#070e11" stroke="#38464a" stroke-width="4"/>
    <rect x="16" y="18" width="388" height="554" rx="34" fill="#091519"/>
    <text x="42" y="54" class="h2">Work space</text>
    <text x="42" y="76" class="small">Managed by Harbor · Local catalog</text>

    <rect x="36" y="94" width="348" height="48" rx="18" fill="#111f23"/>
    <circle cx="58" cy="118" r="8" fill="none" stroke="#839799" stroke-width="2"/>
    <line x1="64" y1="124" x2="70" y2="130" stroke="#839799" stroke-width="2"/>
    <text x="82" y="124" class="body">Search apps</text>

    <text x="38" y="170" class="body">18 apps</text>
    <text x="345" y="170" text-anchor="end" class="pill">Select</text>

    <g transform="translate(36,184)">
      <rect width="348" height="72" rx="18" fill="#132328"/>
      <rect x="14" y="12" width="48" height="48" rx="14" fill="#2a66e8"/>
      <text x="78" y="32" class="h2">Signal</text>
      <rect x="78" y="42" width="70" height="22" rx="11" fill="#113a36"/>
      <text x="113" y="57" text-anchor="middle" class="pill">Available</text>
      <text x="325" y="42" class="body">•••</text>
    </g>
    <g transform="translate(36,266)">
      <rect width="348" height="72" rx="18" fill="#132328"/>
      <rect x="14" y="12" width="48" height="48" rx="14" fill="#8f345c"/>
      <text x="78" y="32" class="h2">Firefox</text>
      <rect x="78" y="42" width="70" height="22" rx="11" fill="#113a36"/>
      <text x="113" y="57" text-anchor="middle" class="pill">Available</text>
      <text x="325" y="42" class="body">•••</text>
    </g>
    <g transform="translate(36,348)">
      <rect width="348" height="72" rx="18" fill="#132328"/>
      <rect x="14" y="12" width="48" height="48" rx="14" fill="#3a4145"/>
      <text x="78" y="32" class="h2">Mull</text>
      <rect x="78" y="42" width="58" height="22" rx="11" fill="#173047"/>
      <text x="107" y="57" text-anchor="middle" style="font:600 12px system-ui,sans-serif; fill:#9dd8ff">Frozen</text>
      <text x="325" y="42" class="body">•••</text>
    </g>

    <rect x="24" y="432" width="372" height="154" rx="26" fill="#18262b" stroke="#304247"/>
    <rect x="178" y="442" width="64" height="5" rx="3" fill="#718184"/>
    <text x="48" y="476" class="h2">Signal</text>
    <line x1="48" y1="490" x2="372" y2="490" class="divider"/>
    <text x="48" y="516" class="body">Open</text>
    <text x="48" y="544" class="body">Freeze</text>
    <text x="150" y="544" class="body">Add to launcher</text>
    <text x="48" y="572" class="danger" style="font:500 15px system-ui,sans-serif">Uninstall</text>
  </g>

  <text x="600" y="742" text-anchor="middle" class="subtitle">Visual scaffold only · implementation plan defines authoritative behavior and copy</text>
</svg>
